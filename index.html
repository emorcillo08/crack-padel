<title>Crack Padel</title>

<style>
/* Layout: app móvil de una columna con barra inferior fija. El ranking se lee como marcador de cancha: filas con líneas finas, sin tarjetas. Look oscuro fijo, inspirado en Premier Padel. */
:root {
  --bg: #0A1322;
  --surface: #101C32;
  --raise: #17253F;
  --line: #243450;
  --fg: #E9EFFA;
  --muted: #8C9CB8;
  --court: #4A86FF;
  --ball: #DDF247;
  --ball-ink: #121A05;
  --bad: #FF8A8A;
  --font-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--bg); }
body {
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 0;
}
* { box-sizing: border-box; }
.app { max-width: 560px; margin: 0 auto; padding-bottom: 120px; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--court); outline-offset: 2px; }

.brand { display: flex; flex-direction: column; gap: 2px; margin-bottom: 22px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }

.vh { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
.vh h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.vh p { color: var(--muted); font-size: 13px; }
.sec { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 4px; }
.back { display: inline-block; margin-bottom: 10px; color: var(--muted); text-decoration: none; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; }
.titlebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.titlebar .vh { min-width: 0; }

.btn { border: 0; border-radius: 12px; min-height: 46px; padding: 0 18px; font-weight: 700; cursor: pointer; background: var(--ball); color: var(--ball-ink); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); font-weight: 500; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }

/* Ranking y posiciones: PJ, G, E, P y puntos */
.thead, .row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 30px 30px 30px 30px 46px; align-items: center; column-gap: 2px; }
.thead.noe, .row.noe { grid-template-columns: 24px minmax(0, 1fr) 34px 34px 34px 50px; }
.thead.pa, .row.pa { grid-template-columns: 22px minmax(0, 1fr) 28px 28px 28px 28px 40px 40px; }
.row.pa .pts { font-size: 24px; }
.thead { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 0 8px; border-bottom: 1px solid var(--line); }
.thead span:not(:nth-child(2)) { text-align: center; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.pos { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.who { display: flex; flex-direction: column; min-width: 0; }
.nm { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm.wrap { white-space: normal; overflow-wrap: anywhere; font-size: 15px; }
.sub { font-size: 12px; color: var(--muted); }
.n { text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.pts { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.row.lead .pos, .row.lead .pts { color: var(--ball); }
.legend { margin-top: 12px; font-size: 12px; color: var(--muted); }

/* Juegos y jornadas */
.games { display: flex; flex-direction: column; }
.sb { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 34px); align-items: center; column-gap: 2px; color: var(--muted); }
.sbn { display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.sb.w { color: var(--fg); font-weight: 700; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.sb.w .dot { background: var(--ball); }
.sc { font-family: var(--font-display); font-size: 22px; text-align: center; font-variant-numeric: tabular-nums; }
.sc.sw { color: var(--fg); font-weight: 700; }
.confirm { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.jrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.jrow .nm { white-space: normal; overflow-wrap: anywhere; }
.prog { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--fg); font-variant-numeric: tabular-nums; }
.prog.done { color: var(--ball); }
.round { margin-top: 24px; scroll-margin-top: 16px; }
.rh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.rh h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.rest { font-size: 12px; color: var(--muted); text-align: right; }
.match { padding: 12px 0; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.mact { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.editor { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pts-ed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pts-ed input { text-align: center; font-family: var(--font-display); font-size: 26px; min-height: 52px; }
.editor .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* Formularios */
.form { display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group h3 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.tag { width: 10px; height: 10px; border-radius: 3px; background: var(--court); }
.tag.b { background: #FF9F43; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input, .field select, .inline input {
  background: var(--raise); border: 1px solid var(--line); border-radius: 10px; min-height: 46px; padding: 0 12px; font-size: 16px; color: var(--fg); width: 100%;
}
.field select option { background: var(--surface); }
.setrow { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 10px; align-items: center; }
.setrow .lbl { font-size: 13px; color: var(--muted); }
.setrow input { text-align: center; font-family: var(--font-display); font-size: 24px; min-height: 52px; padding: 0 4px; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); width: 100%; }
.setcap { display: grid; grid-template-columns: 64px 1fr 1fr; gap: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; }
.err { min-height: 18px; font-size: 13px; color: var(--bad); }
.plan { font-size: 14px; color: var(--ball); font-weight: 500; }
.inline { display: flex; gap: 8px; }
.inline .btn { flex: none; }
.plist { list-style: none; margin: 18px 0 0; padding: 0; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.prow .nm { font-size: 16px; }
.prow.editing { display: block; }
.prow.off .nm { color: var(--muted); }
.pacts { display: flex; gap: 6px; flex: none; }
.rh { flex-wrap: wrap; }
.by { margin-top: 40px; text-align: center; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.rules { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
.rules .three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.addmore { display: flex; gap: 8px; align-items: flex-end; }
.addmore .field { flex: 1; min-width: 0; }
.empty { padding: 28px 0; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty a { color: var(--ball); font-weight: 700; text-decoration: none; border-bottom: 1px solid var(--ball); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); min-height: 42px; border-radius: 9px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--raise); color: var(--fg); border-radius: 999px; min-height: 40px; padding: 0 14px; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); font-weight: 700; }
.chip:disabled { opacity: .35; cursor: default; }
.count { font-size: 13px; color: var(--muted); }
.quick { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }

/* Comunidades */
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.opt { text-align: left; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.opt strong { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; }
.opt span { color: var(--muted); font-size: 13px; line-height: 1.4; }
.codebox { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.code { font-family: var(--font-display); font-weight: 700; font-size: 38px; letter-spacing: .1em; color: var(--ball); line-height: 1; overflow-wrap: anywhere; }
.codebox .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.help { font-size: 13px; color: var(--muted); }
.ver { margin-top: 24px; font-size: 12px; color: var(--muted); }

/* Barra inferior */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 5;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.bar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 2px; font-size: 11px; color: var(--muted); text-decoration: none; border-radius: 12px; }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--fg); }
.tab[aria-current="page"] svg { stroke: var(--ball); }
.tab.new .ico { width: 40px; height: 40px; border-radius: 50%; background: var(--ball); color: var(--ball-ink); display: grid; place-items: center; margin-top: -16px; box-shadow: 0 0 0 5px var(--surface); }
.tab.new svg, .tab.new[aria-current="page"] svg { stroke: var(--ball-ink); }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; z-index: 6; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
</style>

<script>
(function () {
  'use strict';

  // VERSIÓN DE LA APP: cambia este número cada vez que subas ajustes. Aparece abajo en la pantalla y en la sección Comunidad.
  var APP_VERSION = '2.1';

  // BEGIN LOGIC
  // Puntos por defecto: Victoria 3, Empate 1, Derrota 0.
  var DEFAULT_RULES = { win: 3, draw: 1, loss: 0 };

  function setsResult(sets) {
    var a = 0, b = 0;
    sets.forEach(function (s) { if (s[0] > s[1]) a++; else if (s[1] > s[0]) b++; });
    return { a: a, b: b, winner: a > b ? 'A' : (b > a ? 'B' : null) };
  }

  // Resultado de un juego: por sets (g.sets) o por puntos americanos (g.pts).
  function gameOutcome(g) {
    if (g.pts) {
      var x = g.pts[0], y = g.pts[1];
      return { winner: x > y ? 'A' : (y > x ? 'B' : null), draw: x === y, gA: x, gB: y };
    }
    var r = setsResult(g.sets), gA = 0, gB = 0;
    g.sets.forEach(function (s) { gA += s[0]; gB += s[1]; });
    return { winner: r.winner, draw: false, gA: gA, gB: gB, sa: r.a, sb: r.b };
  }

  function computeRanking(players, games, rules) {
    var drawPts = typeof rules.draw === 'number' ? rules.draw : Math.round((rules.win + rules.loss) / 2);
    var st = {};
    players.forEach(function (p) { st[p.id] = { id: p.id, name: p.name, pj: 0, pg: 0, pe: 0, pp: 0, pts: 0, pa: 0, gf: 0, gc: 0 }; });
    games.forEach(function (g) {
      var o = gameOutcome(g);
      if (!o.winner && !o.draw) return;
      g.a.forEach(function (id) { if (st[id]) { st[id].gf += o.gA; st[id].gc += o.gB; } });
      g.b.forEach(function (id) { if (st[id]) { st[id].gf += o.gB; st[id].gc += o.gA; } });
      if (g.pts) {
        g.a.forEach(function (id) { if (st[id]) st[id].pa += g.pts[0]; });
        g.b.forEach(function (id) { if (st[id]) st[id].pa += g.pts[1]; });
      }
      if (o.draw) {
        g.a.concat(g.b).forEach(function (id) { if (st[id]) { st[id].pj++; st[id].pe++; st[id].pts += drawPts; } });
        return;
      }
      var win = o.winner === 'A' ? g.a : g.b;
      var lose = o.winner === 'A' ? g.b : g.a;
      win.forEach(function (id) { if (st[id]) { st[id].pj++; st[id].pg++; st[id].pts += rules.win; } });
      lose.forEach(function (id) { if (st[id]) { st[id].pj++; st[id].pp++; st[id].pts += rules.loss; } });
    });
    var list = Object.keys(st).map(function (k) { return st[k]; });
    list.forEach(function (s) { s.ef = s.pj ? s.pg / s.pj : 0; });
    list.sort(function (x, y) {
      return (y.pts - x.pts) || (y.ef - x.ef) || ((y.gf - y.gc) - (x.gf - x.gc)) || x.name.localeCompare(y.name, 'es');
    });
    return list;
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function zeros(n) {
    var m = [];
    for (var i = 0; i < n; i++) m.push(new Array(n).fill(0));
    return m;
  }

  // Rondas recomendadas en Americano individual: que cada jugador haga pareja con todos una vez.
  function defaultRounds(n) {
    var m = Math.floor(n / 4);
    if (m < 1) return 0;
    return Math.ceil((n * (n - 1) / 2) / (2 * m));
  }

  // Todas las parejas contra todas (método del círculo). Si son impares, una descansa cada ronda.
  function roundRobinPairs(pairs) {
    var list = pairs.slice();
    if (list.length % 2) list.push(null);
    var n = list.length, rounds = [];
    var fixed = list[0], rot = list.slice(1);
    for (var r = 0; r < n - 1; r++) {
      var arr = [fixed].concat(rot), matches = [], rest = [];
      for (var i = 0; i < n / 2; i++) {
        var x = arr[i], y = arr[n - 1 - i];
        if (x === null || y === null) rest = rest.concat(x || y);
        else matches.push({ a: x.slice(), b: y.slice() });
      }
      rounds.push({ matches: matches, rest: rest });
      rot.unshift(rot.pop());
    }
    return rounds;
  }

  // Cada jugador hace pareja con todos exactamente una vez (n par). Devuelve n-1 rondas de parejas.
  function circleRounds(ids) {
    var n = ids.length, rounds = [], fixed = ids[0], rot = ids.slice(1);
    for (var r = 0; r < n - 1; r++) {
      var arr = [fixed].concat(rot), pairs = [];
      for (var i = 0; i < n / 2; i++) pairs.push([arr[i], arr[n - 1 - i]]);
      rounds.push(pairs);
      rot.unshift(rot.pop());
    }
    return rounds;
  }

  // Americano individual con n múltiplo de 4: parejas perfectas; se reparte quién enfrenta a quién.
  function americanoCircle(ids, R) {
    var n = ids.length, best = null;
    for (var t = 0; t < 80; t++) {
      var order = shuffle(ids.slice()), idx = {};
      order.forEach(function (id, i) { idx[id] = i; });
      var base = circleRounds(order), opp = zeros(n), part = zeros(n), rounds = [], oppCost = 0, repeats = 0;
      for (var r = 0; r < R; r++) {
        var pairs = base[r % (n - 1)], bestPerm = null, bc = Infinity;
        for (var s = 0; s < 200 && bc > 0; s++) {
          var perm = shuffle(pairs.slice()), c = 0;
          for (var k = 0; k < perm.length; k += 2) {
            var P = perm[k], Q = perm[k + 1];
            c += opp[idx[P[0]]][idx[Q[0]]] + opp[idx[P[0]]][idx[Q[1]]] + opp[idx[P[1]]][idx[Q[0]]] + opp[idx[P[1]]][idx[Q[1]]];
          }
          if (c < bc) { bc = c; bestPerm = perm; }
        }
        var matches = [];
        for (var k2 = 0; k2 < bestPerm.length; k2 += 2) {
          var A = bestPerm[k2], B = bestPerm[k2 + 1];
          matches.push({ a: A.slice(), b: B.slice() });
          [[A, B], [B, A]].forEach(function (pq) {
            pq[0].forEach(function (x) { pq[1].forEach(function (y) { opp[idx[x]][idx[y]]++; }); });
          });
          [A, B].forEach(function (P2) {
            var i = idx[P2[0]], j = idx[P2[1]];
            if (part[i][j] > 0) repeats++;
            part[i][j]++; part[j][i]++;
          });
        }

      sessionMatches(s).forEach(function (m) {
        if (m.res) out.push({ id: m.id, date: s.date, a: m.a, b: m.b, sets: m.res.sets, pts: m.res.pts });
      });
    });
    return out;
  }
  function sessionProgress(s) {
    var all = sessionMatches(s);
    return { done: all.filter(function (m) { return m.res; }).length, total: all.length };
  }
  function sessionTitle(s) { return s.name || (s.mode === 'americano' ? 'Americano · ' + s.target + ' pts' : 'Por sets'); }
  function sessionFormat(s) {
    if (s.mode === 'sets') return 'Por sets';
    return 'Americano · ' + s.target + ' pts · ' + (s.pairing === 'fixed' ? 'Parejas fijas' : 'Individual');
  }
  function sessionSize(s) {
    if (s.mode === 'americano' && s.pairing !== 'fixed') return s.entrants.length + ' jugadores';
    return s.entrants.length + ' parejas';
  }

  var tt;
  function toast(m) {
    var t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('on');
    clearTimeout(tt);
    tt = setTimeout(function () { t.classList.remove('on'); }, 2600);
  }

  function copyText(t) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }

  var draft = freshDraft();
  function freshDraft() {
    return { mode: 'sets', pairing: 'individual', target: 16, nPairs: 2, pairs: [['', ''], ['', '']], nPlayers: 8, chosen: [], rounds: '', name: '', date: todayStr() };
  }
  function pairCount() { return draft.mode === 'sets' ? 2 : (draft.pairing === 'fixed' ? draft.nPairs : 0); }
  function normalizeDraft() {
    var ids = sortedPlayers().map(function (p) { return p.id; });
    draft.nPairs = Math.max(2, Math.min(8, draft.nPairs));
    draft.nPlayers = Math.max(4, Math.min(16, draft.nPlayers));
    var need = Math.max(2, pairCount());
    while (draft.pairs.length < need) draft.pairs.push(['', '']);
    draft.pairs.length = need;
    draft.pairs = draft.pairs.map(function (p) { return p.map(function (x) { return ids.indexOf(x) >= 0 ? x : ''; }); });
    draft.chosen = draft.chosen.filter(function (x) { return ids.indexOf(x) >= 0; }).slice(0, draft.nPlayers);
  }
  function planInfo() {
    if (draft.mode === 'sets') return '2 parejas · 1 juego a sets. Luego puedes agregar más juegos.';
    if (draft.pairing === 'fixed') {
      var M = draft.nPairs, rounds = M % 2 ? M : M - 1, games = M * (M - 1) / 2;
      return M + ' parejas fijas · ' + rounds + (rounds === 1 ? ' ronda' : ' rondas') + ' · ' + games + (games === 1 ? ' juego' : ' juegos') + ' a ' + draft.target + ' puntos, todas contra todas';
    }
    var N = draft.nPlayers, m = Math.floor(N / 4), R = parseInt(draft.rounds, 10) || defaultRounds(N);
    R = Math.max(1, Math.min(30, R));
    var txt = N + ' jugadores · ' + R + (R === 1 ? ' ronda' : ' rondas') + ' · ' + (R * m) + (R * m === 1 ? ' juego' : ' juegos') + ' a ' + draft.target + ' puntos';
    if (N - 4 * m) txt += ' · ' + (N - 4 * m) + (N - 4 * m === 1 ? ' descansa' : ' descansan') + ' por ronda';
    return txt;
  }

  /* ---------- Pantalla de inicio (elegir comunidad) ---------- */
  var pick = freshPick();
  function freshPick() { return { view: 'home', name: '', code: '', busy: false, msg: '', forget: null }; }

  function resetUi() {
    editing = null; renaming = false; renamingCom = false; confirmSess = false; confirmRound = null;
    pf = freshPf(); draft = freshDraft(); pendingRender = false;
  }

  function enterLocal() {
    stopSync(); resetUi();
    prefs.mode = 'local'; prefs.code = ''; savePrefs();
    loadLocal();
    appState = 'ready'; render();
  }
  function enterCloud(code, name) {
    stopSync(); resetUi();
    data = emptyData();
    prefs.mode = 'cloud'; prefs.code = code; rememberCommunity(code, name); savePrefs();
    data.name = name || communityName(code);
    appState = 'loading'; render();
    var tok = syncTok;
    ensureAuth().then(function () { if (tok === syncTok) startSync(code); })
      .catch(function (e) { if (tok !== syncTok) return; appState = 'error'; gateMsg = errText(e); render(); });
  }
  function leaveCommunity() {
    stopSync(); resetUi();
    prefs.mode = null; prefs.code = ''; savePrefs();
    data = emptyData(); pick = freshPick();
    appState = 'pick'; render();
  }

  // Un código nuevo que no exista todavía.
  function freeCode(n) {
    var c = newCode();
    return cdoc(c).collection('config').doc('main').get().then(function (s) {
      if (!s.exists) return c;
      if (n > 4) throw new Error('No se pudo generar un código');
      return freeCode(n + 1);
    });
  }
  // Crea la comunidad con su código. Si recibe src (datos del modo local), los copia dentro.
  function createCommunity(name, src) {
    pick.busy = true; pick.msg = ''; render();
    var code;
    ensureAuth().then(function () { return freeCode(0); }).then(function (c) {
      code = c;
      var out = serializeData({ name: name, players: src ? src.players : [], sessions: src ? src.sessions : [], rules: src ? src.rules : normRules(null) });
      var ops = [{ c: 'config', id: 'main', j: out.config }], cd = cdoc(code), jobs = [];
      COLLS.forEach(function (k) { Object.keys(out[k]).forEach(function (id) { ops.push({ c: k, id: id, j: out[k][id] }); }); });
      for (var i = 0; i < ops.length; i += 400) {
        var b = db.batch();
        ops.slice(i, i + 400).forEach(function (o) { b.set(cd.collection(o.c).doc(o.id), { j: o.j }); });
        jobs.push(b.commit());
      }
      return Promise.all(jobs);
    }).then(function () {
      pick = freshPick();
      enterCloud(code, name); go('comunidad');
      toast('Comunidad creada');
    }).catch(function (e) { pick.busy = false; pick.msg = errText(e); render(); });
  }
  function joinCommunity() {
    var c = cleanCode(pick.code);
    if (!validCode(c)) { pick.msg = 'El código tiene 10 letras y números. Revisa que esté completo.'; render(); return; }
    pick.busy = true; pick.msg = ''; render();
    ensureAuth().then(function () { return cdoc(c).collection('config').doc('main').get(); }).then(function (snap) {
      if (!snap.exists) { pick.busy = false; pick.msg = 'No existe ninguna comunidad con ese código. Revísalo con quien te lo pasó.'; render(); return; }
      var nm = '';
      try { nm = JSON.parse(snap.data().j).name; } catch (e) {}
      pick = freshPick();
      enterCloud(c, nm || 'Comunidad'); go('ranking');
    }).catch(function (e) { pick.busy = false; pick.msg = errText(e); render(); });
  }

  function gateHtml() {
    if (appState === 'pick') return pickHtml();

      return '<div class="empty"><p>' + esc(gateMsg) + '</p><div class="inline"><button class="btn" data-act="retry">Reintentar</button><button class="btn ghost" data-act="leave">Cambiar de comunidad</button></div></div>';
    }
    return '<div class="empty"><p>Conectando…</p><button class="btn ghost small" data-act="leave">Cambiar de comunidad</button></div>';
  }

  function savedRowsHtml() {

          '<button class="btn small danger" data-act="pk-forget-yes" data-id="' + j.code + '">Sí, quitar</button><button class="btn small ghost" data-act="pk-forget-no">No</button></div></li>';

        '<button class="btn small ghost" data-act="pk-forget" data-id="' + j.code + '">Quitar</button></div></li>';

  function pickHtml() {
    var p = pick, html = '';
    var back = '<button type="button" class="back" data-act="pk-back">← Volver</button>';
    if (p.view === 'create') {
      return back + '<form class="form" id="create-form" novalidate><div class="vh"><h2>Crear comunidad</h2><p>Se genera un código único. Quien lo escriba verá y registrará los mismos juegos que tú.</p></div>' +
        '<label class="field" for="pk-name"><span>Nombre de la comunidad</span><input id="pk-name" type="text" maxlength="40" data-pkname value="' + esc(p.name) + '" placeholder="Ej. Los RompeVidrios" autocomplete="off"></label>' +
        '<p class="err" role="alert">' + esc(p.msg) + '</p><button class="btn block" type="submit"' + (p.busy ? ' disabled' : '') + '>' + (p.busy ? 'Creando…' : 'Crear comunidad') + '</button></form>';
    }
    if (p.view === 'join') {
      return back + '<form class="form" id="join-form" novalidate><div class="vh"><h2>Unirme con un código</h2><p>Escribe el código que te pasó quien creó la comunidad.</p></div>' +
        '<label class="field" for="pk-code"><span>Código de la comunidad</span><input id="pk-code" type="text" data-pkcode value="' + esc(p.code) + '" placeholder="XXXXX-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase;letter-spacing:.1em"></label>' +
        '<p class="err" role="alert">' + esc(p.msg) + '</p><button class="btn block" type="submit"' + (p.busy ? ' disabled' : '') + '>' + (p.busy ? 'Verificando…' : 'Entrar a la comunidad') + '</button></form>';
    }
    html = '<div class="vh"><h2>Bienvenido</h2><p>¿Cómo quieres usar Crack Padel?</p></div>';
    if (prefs.joined.length) html += '<h3 class="sec" style="margin-top:0">Tus comunidades</h3>' + savedRowsHtml() + '<h3 class="sec">Otras opciones</h3>';
    html += '<div class="opts">' +
      '<button class="opt" data-act="pk-view" data-id="create"><strong>Crear una comunidad</strong><span>Se genera un código para compartir. Todos los que entren ven los mismos juegos y el mismo ranking.</span></button>' +
      '<button class="opt" data-act="pk-view" data-id="join"><strong>Unirme con un código</strong><span>Para entrar a la comunidad de otra persona.</span></button>' +
      '<button class="opt" data-act="pk-local"><strong>Usar solo en este teléfono</strong><span>Modo local: los datos no se comparten con nadie. Después puedes convertirlo en comunidad.</span></button>';
    html += '</div>';
    if (p.msg) html += '<p class="err" role="alert" style="margin-top:12px">' + esc(p.msg) + '</p>';
    return html;
  }

  /* ---------- Vistas ---------- */
  function theadHtml(first, last, noe) {
    var cols = ['#', first, 'PJ', 'G'].concat(noe ? [] : ['E']).concat(['P', last]);
    return '<div class="thead' + (noe ? ' noe' : '') + '" aria-hidden="true">' + cols.map(function (c) { return '<span>' + c + '</span>'; }).join('') + '</div>';
  }
  function standRows(list, lastFn, leadOn, noe) {
    return '<ol class="rows">' + list.map(function (s, i) {
      return '<li class="row' + (noe ? ' noe' : '') + (i === 0 && leadOn(s) ? ' lead' : '') + '"><span class="pos">' + (i + 1) + '</span>' +
        '<div class="who"><span class="nm wrap">' + esc(s.name) + '</span></div>' +
        '<span class="n">' + s.pj + '</span><span class="n">' + s.pg + '</span>' + (noe ? '' : '<span class="n">' + s.pe + '</span>') + '<span class="n">' + s.pp + '</span>' +
        '<span class="pts">' + lastFn(s) + '</span></li>';
    }).join('') + '</ol>';

  function viewRanking() {
    var r = data.rules;
    var head = '<div class="vh"><h2>Ranking</h2><p>Victoria ' + r.win + ' · Empate ' + r.draw + ' · Derrota ' + r.loss + ' pts</p></div>';
    var activeList = sortedPlayers();
    if (!activeList.length) {
      return head + '<div class="empty"><p>Aún no hay jugadores activos en el ranking.</p><a href="#jugadores">Ir a Jugadores</a></div>';
    }
    var rk = computeRanking(activeList, playedGames(), data.rules);
    var rows = rk.map(function (s, i) {
      return '<li class="row pa' + (i === 0 && s.pj ? ' lead' : '') + '">' +
        '<span class="pos">' + (i + 1) + '</span>' +

        '<span class="n">' + s.pj + '</span><span class="n">' + s.pg + '</span><span class="n">' + s.pe + '</span><span class="n">' + s.pp + '</span>' +
        '<span class="pts">' + s.pts + '</span><span class="n">' + (s.pa ? s.pa : '–') + '</span></li>';
    }).join('');
    return head +
      '<div class="thead pa" aria-hidden="true"><span>#</span><span>Jugador</span><span>PJ</span><span>G</span><span>E</span><span>P</span><span>Pts</span><span>PA</span></div>' +
      '<ol class="rows">' + rows + '</ol>' +
      '<p class="legend">PJ jugados · G ganados · E empatados · P perdidos · Pts puntos del ranking · PA puntos acumulados en Americano (parejas fijas e individual)</p>';

  function scoreLines(m) {
    var out = m.res ? gameOutcome({ sets: m.res.sets, pts: m.res.pts }) : null;
    var line = function (ids, side) {
      var won = out && out.winner === side, cells, cols = 1;
      if (!m.res) cells = '<span class="sc">–</span>';
      else if (m.res.pts) cells = '<span class="sc' + (won ? ' sw' : '') + '">' + m.res.pts[side === 'A' ? 0 : 1] + '</span>';
      else {
        cols = m.res.sets.length;
        cells = m.res.sets.map(function (s) {
          var me = side === 'A' ? s[0] : s[1], op = side === 'A' ? s[1] : s[0];
          return '<span class="sc' + (me > op ? ' sw' : '') + '">' + me + '</span>';
        }).join('');
      }
      return '<div class="sb' + (won ? ' w' : '') + '" style="--cols:' + cols + '"><span class="sbn"><i class="dot"></i><span>' + names(ids) + '</span></span>' + cells + '</div>';
    };
    return line(m.a, 'A') + line(m.b, 'B');
  }

  function viewJuegos() {
    var n = data.sessions.length;
    var head = '<div class="vh"><h2>Juegos</h2><p>' + n + (n === 1 ? ' jornada' : ' jornadas') + '</p></div>';
    if (!n) return head + '<div class="empty"><p>Todavía no hay jornadas.</p><a href="#nuevo">Crear una jornada</a></div>';
    var js = data.sessions.slice().reverse().sort(function (a, b) { return b.date.localeCompare(a.date); });
    return head + '<div class="games">' + js.map(function (s) {
      var p = sessionProgress(s);
      return '<a class="jrow" href="#jornada-' + s.id + '"><div class="who"><span class="nm">' + esc(sessionTitle(s)) + '</span><span class="sub">' + esc(fmtDate(s.date)) + ' · ' + esc(sessionFormat(s)) + ' · ' + sessionSize(s) + '</span></div>' +
        '<span class="prog' + (p.done === p.total ? ' done' : '') + '">' + p.done + '/' + p.total + '</span></a>';
    }).join('') + '</div>';
  }

  function pairSelect(i, j) {
    var taken = [];
    draft.pairs.forEach(function (p, pi) { p.forEach(function (x, pj) { if (x && !(pi === i && pj === j)) taken.push(x); }); });
    var opts = sortedPlayers().map(function (p) {
      return '<option value="' + p.id + '"' + (draft.pairs[i][j] === p.id ? ' selected' : '') + (taken.indexOf(p.id) >= 0 ? ' disabled' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
    return '<label class="field" for="pr' + i + '-' + j + '"><span>Jugador ' + (j + 1) + '</span><select id="pr' + i + '-' + j + '" data-pair="' + i + ',' + j + '"><option value="">Elegir jugador</option>' + opts + '</select></label>';
  }
  function countOptions(from, to, sel, unit) {
    var o = '';
    for (var v = from; v <= to; v++) o += '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + v + ' ' + unit + '</option>';
    return o;
  }

    }).join('') + '</div></div>';

  function editorButtons(m) {

  function matchHtml(s, m) {

      (isEd ? editorHtml(s, m) : '<div class="mact"><button class="btn small ghost" data-act="edit" data-id="' + m.id + '">' + (m.res ? 'Editar' : 'Registrar') + '</button></div>') +

  function addMoreHtml(s, p) {
    var hint = p.done === p.total ? 'Ya se jugaron todos los juegos. Si hay tiempo, agrega más.' : 'Agrega más juegos cuando los necesites.';

    var init = Math.max(1, Math.min(30, s.initialRounds || s.rounds.length)), maxK = Math.max(6, init);
    for (var k = 1; k <= maxK; k++) opts += '<option value="' + k + '"' + (k === init ? ' selected' : '') + '>' + k + (k === 1 ? ' ronda' : ' rondas') + ' · ' + (k * per) + (k * per === 1 ? ' juego' : ' juegos') + '</option>';

  function viewJornada(sid) {
    var s = findSession(sid);
    if (!s) return '<a class="back" href="#juegos">← Juegos</a><div class="empty"><p>Esa jornada no existe.</p><a href="#juegos">Ver jornadas</a></div>';

      }
    } else if (sessionMatches(s).length > 1) {
      var ss = setsStandings(s, nameOf);
      html += '<h3 class="sec" style="margin-top:6px">Marcador</h3>' + theadHtml('Pareja', 'Dif', true) +
        standRows(ss, function (x) { return (x.sd > 0 ? '+' : '') + x.sd; }, function (x) { return x.pj > 0; }, true) +

        (r.rest.length ? '<span class="rest">Descansan: ' + names(r.rest, ', ') + '</span>' : '') + del + '</div>' +
        r.matches.map(function (m) { return matchHtml(s, m); }).join('') + '</section>';

    html += addMoreHtml(s, p);
    html += '<div class="mact" style="margin-top:26px">' + (confirmSess
      ? '<span class="confirm">¿Borrar la jornada y sus resultados? <button class="btn small danger" data-act="sess-del-yes">Sí</button><button class="btn small ghost" data-act="sess-del-no">No</button></span>'
      : '<button class="btn small ghost" data-act="sess-del">Borrar jornada</button>') + '</div>';

      '<label class="field" for="r-loss"><span>Derrota</span><input id="r-loss" type="number" inputmode="numeric" min="0" max="20" value="' + r.loss + '"></label></div></section>';

      '<div class="mact" style="justify-content:flex-start;margin-top:22px"><button class="btn ghost" data-act="leave">Cambiar de comunidad</button></div>' +

  function render() {
    var bar = document.getElementById('bar'), eb = document.getElementById('eyebrow');
    if (appState !== 'ready') {
      main.innerHTML = gateHtml();
      if (bar) bar.hidden = true;
      if (eb) eb.textContent = appState === 'pick' ? 'Inicio' : (appState === 'error' ? 'Sin conexión' : 'Conectando…');
      return;
    }
    if (bar) bar.hidden = false;
    var r = route(), html;
    if (r.v === 'ranking') html = viewRanking();
    else if (r.v === 'nuevo') html = viewNuevo();
    else if (r.v === 'juegos') html = viewJuegos();
    else if (r.v === 'jornada') html = viewJornada(r.sid);
    else if (r.v === 'comunidad') html = viewComunidad();
    else html = viewJugadores();
    main.innerHTML = html;
    if (eb) eb.textContent = prefs.mode === 'local' ? 'Modo local · solo en este teléfono' : (data.name || 'Comunidad');
    var active = r.v === 'jornada' ? 'juegos' : r.v;
    document.querySelectorAll('.tab').forEach(function (a) {
      if (a.getAttribute('data-v') === active) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (scrollToRound) {
      var el = document.getElementById('round-' + scrollToRound);
      scrollToRound = null;
      if (el) el.scrollIntoView();
    }
  }

  /* ---------- Acciones ---------- */
  function generateSession() {
    var err = document.getElementById('err');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(draft.date)) { err.textContent = 'Elige la fecha de la jornada.'; return; }
    var s = { id: uid(), created: Date.now(), date: draft.date, mode: draft.mode, pairing: draft.mode === 'americano' ? draft.pairing : null,
      target: draft.mode === 'americano' ? draft.target : null, name: draft.name.trim().replace(/\s+/g, ' ').slice(0, 40), entrants: [], rounds: [], stats: null };
    var built;
    if (draft.mode === 'sets' || draft.pairing === 'fixed') {
      var flat = [], pairs = draft.pairs.slice(0, pairCount());
      for (var i = 0; i < pairs.length; i++) {
        if (!pairs[i][0] || !pairs[i][1]) { err.textContent = 'Completa los dos jugadores de la pareja ' + (i + 1) + '.'; return; }
        flat.push(pairs[i][0], pairs[i][1]);
      }
      if (new Set(flat).size !== flat.length) { err.textContent = 'Cada jugador solo puede estar en una pareja.'; return; }
      s.entrants = pairs.map(function (p) { return p.slice(); });
      built = roundRobinPairs(s.entrants);
    } else {
      if (draft.chosen.length !== draft.nPlayers) { err.textContent = 'Elige ' + draft.nPlayers + ' jugadores (llevas ' + draft.chosen.length + ').'; return; }
      var R = parseInt(draft.rounds, 10) || defaultRounds(draft.nPlayers);
      if (R < 1 || R > 30) { err.textContent = 'Las rondas deben estar entre 1 y 30.'; return; }
      s.entrants = draft.chosen.slice();
      var sched = americanoSchedule(s.entrants, R);
      built = sched.rounds;
      s.stats = { partnerRepeats: sched.partnerRepeats };
    }
    s.rounds = built.map(function (r) {
      return { rest: r.rest, matches: r.matches.map(function (m) { return { id: uid() + Math.random().toString(36).slice(2, 5), a: m.a, b: m.b, res: null }; }) };
    });
    s.initialRounds = s.rounds.length;
    data.sessions.push(s);
    persist();
    var keep = { mode: draft.mode, pairing: draft.pairing, target: draft.target };
    draft = freshDraft(); draft.mode = keep.mode; draft.pairing = keep.pairing; draft.target = keep.target;
    toast('Jornada creada');
    location.hash = 'jornada-' + s.id;
  }

  function addRounds(k) {
    var s = findSession(route().sid);
    if (!s) return;
    var first = s.rounds.length + 1;
    extendSession(s, k).forEach(function (r) {
      s.rounds.push({ added: true, rest: r.rest, matches: r.matches.map(function (m) { return { id: uid() + Math.random().toString(36).slice(2, 5), a: m.a, b: m.b, res: null }; }) });
    });
    if (s.mode === 'americano' && s.pairing !== 'fixed') s.stats = { partnerRepeats: partnerRepeatsOf(s) };
    persist();
    scrollToRound = first;
    render();
    toast(s.mode === 'sets' ? 'Juego agregado' : (k === 1 ? 'Ronda agregada' : k + ' rondas agregadas'));
  }

  function findMatch(mid) {
    for (var i = 0; i < data.sessions.length; i++) {
      var ms = sessionMatches(data.sessions[i]);
      for (var j = 0; j < ms.length; j++) if (ms[j].id === mid) return { s: data.sessions[i], m: ms[j] };
    }
    return null;
  }

  function openEditor(mid) {
    var f = findMatch(mid);
    if (!f) return;
    var e = { mid: mid, pa: '', pb: '', sets: [['', ''], ['', ''], ['', '']] };
    if (f.m.res && f.m.res.pts) { e.pa = String(f.m.res.pts[0]); e.pb = String(f.m.res.pts[1]); }
    if (f.m.res && f.m.res.sets) f.m.res.sets.forEach(function (st, i) { e.sets[i] = [String(st[0]), String(st[1])]; });
    editing = e;
    render();
  }

  function saveResult(mid) {
    var f = findMatch(mid), err = document.getElementById('e-err');
    if (!f || !editing) return;
    if (f.s.mode === 'americano') {
      var a = Number(editing.pa), b = Number(editing.pb), t = f.s.target;
      if (editing.pa === '' || editing.pb === '' || !Number.isInteger(a) || !Number.isInteger(b) || a < 0 || b < 0) { err.textContent = 'Escribe los puntos de las dos parejas.'; return; }
      if (a + b !== t) { err.textContent = 'Los puntos de ambas parejas deben sumar ' + t + '.'; return; }
      f.m.res = { pts: [a, b] };
    } else {
      var p = parseSets(editing.sets);
      if (p.error) { err.textContent = p.error; return; }
      f.m.res = { sets: p.sets };
    }
    editing = null;
    persist(); render(); toast('Resultado guardado');
  }

  function validPlayer(st, selfId) {
    var name = st.name.trim().replace(/\s+/g, ' ');
    if (!name) return { error: 'Escribe un nombre.' };
    if (!st.gender) return { error: 'Elige el género.' };
    if (!st.cat) return { error: 'Elige la clasificación.' };
    var dup = data.players.some(function (p) { return p.id !== selfId && p.name.toLowerCase() === name.toLowerCase(); });
    if (dup) return { error: 'Ese jugador ya existe.' };
    return { name: name };
  }
  function addPlayer(k) {
    var st = pf[k], v = validPlayer(st, null);
    if (v.error) { toast(v.error); return; }
    data.players.push({ id: uid(), created: Date.now(), name: v.name, gender: st.gender, cat: st.cat });
    pf[k] = { name: '', gender: '', cat: '' };
    persist(); render(); toast(v.name + ' agregado');
    var again = document.getElementById(k + '-name');
    if (again) again.focus();
  }
  function savePlayerEdit() {
    var st = pf.edit;
    if (!st) return;
    var v = validPlayer(st, st.id);
    if (v.error) { toast(v.error); return; }
    data.players.forEach(function (p) { if (p.id === st.id) { p.name = v.name; p.gender = st.gender; p.cat = st.cat; } });
    pf.edit = null;
    persist(); render(); toast('Jugador actualizado');
  }

  function shareCode() {
    var link = /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';
    var text = 'Únete a mi comunidad «' + (data.name || 'Crack Padel') + '» en Crack Padel. Código: ' + fmtCode(prefs.code) + (link ? '\n' + link : '');
    if (navigator.share) {
      navigator.share({ title: 'Crack Padel', text: text }).catch(function () {});
    } else {
      copyText(text).then(function (ok) { toast(ok ? 'Invitación copiada' : 'No se pudo copiar'); });
    }
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
    if (act === 'retry') { enterCloud(prefs.code, communityName(prefs.code)); }
    else if (act === 'leave') { leaveCommunity(); }
    else if (act === 'pk-view') { pick.view = id; pick.msg = ''; render(); }
    else if (act === 'pk-back') { pick.view = 'home'; pick.msg = ''; render(); }
    else if (act === 'pk-local') { enterLocal(); go('ranking'); }
    else if (act === 'pk-enter') { pick = freshPick(); enterCloud(id, communityName(id)); go('ranking'); }
    else if (act === 'pk-forget') { pick.forget = id; render(); }
    else if (act === 'pk-forget-no') { pick.forget = null; render(); }
    else if (act === 'pk-forget-yes') {
      prefs.joined = prefs.joined.filter(function (j) { return j.code !== id; });
      savePrefs(); pick.forget = null; render(); toast('Comunidad quitada de este teléfono');
    }
    else if (act === 'code-copy') { copyText(fmtCode(prefs.code)).then(function (ok) { toast(ok ? 'Código copiado' : 'No se pudo copiar'); }); }
    else if (act === 'code-share') { shareCode(); }
    else if (act === 'rencom') { renamingCom = true; render(); var rc = document.getElementById('rencom'); if (rc) rc.focus(); }
    else if (act === 'rencom-cancel') { renamingCom = false; render(); }
    else if (act === 'quick-add') { addPlayer('quick'); }
    else if (act === 'mode') { draft.mode = id; render(); }
    else if (act === 'pairing') { draft.pairing = id; render(); }
    else if (act === 'target') { draft.target = Number(id); render(); }
    else if (act === 'chip') {
      var i = draft.chosen.indexOf(id);
      if (i >= 0) draft.chosen.splice(i, 1); else if (draft.chosen.length < draft.nPlayers) draft.chosen.push(id);
      render();
    }
    else if (act === 'pf-set') {
      var pk = el.getAttribute('data-k'), pfld = el.getAttribute('data-f');
      if (pf[pk]) { pf[pk][pfld] = id; render(); }
    }
    else if (act === 'p-edit') {
      var pl = data.players.filter(function (p) { return p.id === id; })[0];
      if (pl) { pf.edit = { id: pl.id, name: pl.name, gender: pl.gender || '', cat: pl.cat || '' }; render(); }
    }
    else if (act === 'p-cancel') { pf.edit = null; render(); }
    else if (act === 'round-del') { confirmRound = Number(id); render(); }
    else if (act === 'round-del-no') { confirmRound = null; render(); }
    else if (act === 'round-del-yes') {
      var rs = findSession(route().sid), ri = Number(id);
      if (rs && rs.rounds[ri] && rs.rounds[ri].added) {
        rs.rounds.splice(ri, 1);
        if (editing && !findMatch(editing.mid)) editing = null;
        if (rs.mode === 'americano' && rs.pairing !== 'fixed') rs.stats = { partnerRepeats: partnerRepeatsOf(rs) };
        persist();
        toast('Juegos borrados');
      }
      confirmRound = null; render();
    }
    else if (act === 'edit') openEditor(id);
    else if (act === 'cancel-ed') { editing = null; render(); }
    else if (act === 'save-res') saveResult(id);
    else if (act === 'clear-res') {
      var f = findMatch(id);
      if (f) { f.m.res = null; editing = null; persist(); render(); toast('Resultado quitado'); }
    }
    else if (act === 'rename') { renaming = true; render(); var r = document.getElementById('ren'); if (r) r.focus(); }
    else if (act === 'rename-cancel') { renaming = false; render(); }
    else if (act === 'add-more') {
      var sel = document.getElementById('addn');
      addRounds(sel ? parseInt(sel.value, 10) : 1);
    }
    else if (act === 'sess-del') { confirmSess = true; render(); }
    else if (act === 'sess-del-no') { confirmSess = false; render(); }
    else if (act === 'sess-del-yes') {
      var sid = route().sid;
      data.sessions = data.sessions.filter(function (s) { return s.id !== sid; });
      confirmSess = false; editing = null; persist(); toast('Jornada borrada'); location.hash = 'juegos';
    }
    else if (act === 'p-off' || act === 'p-on') {
      var dp = data.players.filter(function (p) { return p.id === id; })[0];
      if (dp) {
        if (act === 'p-off') dp.disabled = true; else delete dp.disabled;
        if (pf.edit && pf.edit.id === id) pf.edit = null;
        persist(); render();
        toast(act === 'p-off' ? dp.name + ' deshabilitado. Su historial se conserva.' : dp.name + ' habilitado');
      }
    }
  });

  var RULE_IDS = { 'r-win': 'win', 'r-draw': 'draw', 'r-loss': 'loss' };
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-n')) {
      var v = parseInt(t.value, 10);
      if (t.getAttribute('data-n') === 'pairs') draft.nPairs = v; else draft.nPlayers = v;
      render();
    }
    else if (t.hasAttribute('data-pair')) {
      var ij = t.getAttribute('data-pair').split(',').map(Number);
      draft.pairs[ij[0]][ij[1]] = t.value;
      render();
    }
    else if (RULE_IDS[t.id]) {
      var n = Math.max(0, Math.min(20, parseInt(t.value, 10)));
      if (isNaN(n)) n = DEFAULT_RULES[RULE_IDS[t.id]];
      data.rules[RULE_IDS[t.id]] = n;
      data.rules.v = 2;
      persist(); render(); toast('Reglas actualizadas');
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-pkname')) {
      pick.name = t.value;
    } else if (t.hasAttribute('data-pkcode')) {
      pick.code = t.value;
    } else if (t.hasAttribute('data-pf')) {
      var pk2 = t.getAttribute('data-pf');
      if (pf[pk2]) pf[pk2].name = t.value;
    } else if (t.hasAttribute('data-rounds')) {
      draft.rounds = t.value;
      var pl = document.getElementById('plan');
      if (pl) pl.textContent = planInfo();
    } else if (t.hasAttribute('data-date')) {
      draft.date = t.value;
    } else if (t.hasAttribute('data-name')) {
      draft.name = t.value;
    } else if (t.hasAttribute('data-ed') && editing) {
      var key = t.getAttribute('data-ed'), other = key === 'pa' ? 'pb' : 'pa';
      editing[key] = t.value;
      var f = findMatch(editing.mid), n = parseInt(t.value, 10);
      if (f && !isNaN(n) && n >= 0 && n <= f.s.target) {
        editing[other] = String(f.s.target - n);
        var o = document.getElementById('e-' + other);
        if (o) o.value = editing[other];
      }
    } else if (t.hasAttribute('data-eset') && editing) {
      var ij = t.getAttribute('data-eset').split(',').map(Number);
      editing.sets[ij[0]][ij[1]] = t.value;
    }
  });

  // Enter en el nombre de "¿Falta alguien?" agrega al jugador, no genera la jornada.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'quick-name') {
      e.preventDefault();
      addPlayer('quick');
    }
  });

  function needName() {
    var name = pick.name.trim().replace(/\s+/g, ' ').slice(0, 40);
    if (!name) { pick.msg = 'Escribe un nombre para la comunidad.'; render(); return ''; }
    return name;
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'gen-form') generateSession();
    else if (id === 'player-form') addPlayer('main');
    else if (id === 'edit-form') savePlayerEdit();
    else if (id === 'create-form') { var n1 = needName(); if (n1) createCommunity(n1, null); }
    else if (id === 'join-form') joinCommunity();
    else if (id === 'conv-form') {
      var n3 = needName();
      if (n3) createCommunity(n3, { players: data.players, sessions: data.sessions, rules: data.rules });
    }
    else if (id === 'rencom-form') {
      var nm = document.getElementById('rencom').value.trim().replace(/\s+/g, ' ').slice(0, 40);
      if (!nm) { toast('Escribe un nombre para la comunidad.'); return; }
      data.name = nm; rememberCommunity(prefs.code, nm); savePrefs();
      renamingCom = false; persist(); render(); toast('Nombre actualizado');
    }
    else if (id === 'ren-form') {
      var s = findSession(route().sid);
      if (s) { s.name = document.getElementById('ren').value.trim().replace(/\s+/g, ' ').slice(0, 40); persist(); }
      renaming = false; render(); toast('Nombre actualizado');
    }
  });

  window.addEventListener('hashchange', function () {
    confirmSess = false; renaming = false; renamingCom = false; editing = null; confirmRound = null; pf.edit = null;
    render(); window.scrollTo(0, 0);
  });

  function boot() {
    var by = document.getElementById('by');
    if (by) by.textContent = 'by Mundi · v' + APP_VERSION;
    if (prefs.mode === 'local') enterLocal();
    else if (prefs.mode === 'cloud' && validCode(prefs.code)) enterCloud(prefs.code, communityName(prefs.code));
    else { appState = 'pick'; render(); }
  }
  boot();
})();
</script>
</body>
</html>
